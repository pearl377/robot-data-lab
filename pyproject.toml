[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-data-lab"
version = "0.1.0"
description = "Auditable LeRobot data quality and imitation-learning experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.3", "pandas>=2.1,<3", "pyarrow>=14", "av>=12", "torch>=2.1", "Pillow>=10"]

[project.scripts]
robot-data-lab = "robot_data_lab.cli:main"

[tool.setuptools.packages.find]
include = ["robot_data_lab*"]
